<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Royal Obsidian &amp; Gold — Animated Cards</title>
<style>
:root{--bg:#030504;--ink:#e9d79a;--dim:#8d7a45;--gold:#c9a24a;--line:rgba(201,162,74,.35);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#030504;--ink:#e9d79a;--dim:#8d7a45}}
:root[data-theme="dark"]{--bg:#030504;--ink:#e9d79a;--dim:#8d7a45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 45%,#0c3a2b 0%,#06201a 38%,#020806 75%,#000 100%),var(--bg);
  color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden;display:flex;flex-direction:column;min-height:100%}
canvas#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
header{position:relative;z-index:2;text-align:center;padding:28px 16px 0}
h1{margin:0;font-weight:400;font-size:clamp(20px,3.4vw,34px);letter-spacing:.32em;text-transform:uppercase;
  background:linear-gradient(100deg,#7a5616,#e6c86e 30%,#fff2bd 50%,#c9a24a 70%,#7a5616);-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:220% 100%;animation:title 7s linear infinite}
@keyframes title{to{background-position:-220% 0}}
header p{margin:8px 0 0;color:var(--dim);font-size:clamp(12px,1.6vw,15px);letter-spacing:.12em}
.stage{position:relative;z-index:1;flex:1;min-height:360px;display:flex;align-items:flex-end;justify-content:center;
  --cw:clamp(86px,19vw,230px);padding-bottom:calc(var(--cw)*.55)}
.fan{position:relative;width:var(--cw);height:calc(var(--cw)*1.4);margin-bottom:calc(var(--cw)*.2)}
.slot{position:absolute;inset:0;transform-origin:50% 165%;
  transform:translateY(60vh) rotate(0) scale(.6);opacity:0;
  transition:transform .95s cubic-bezier(.2,.9,.25,1.05),opacity .5s;transition-delay:calc(var(--i)*110ms)}
.dealt .slot{opacity:1;transform:rotate(calc(var(--k)*11deg))}
.lift{position:absolute;inset:0;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.slot:hover{z-index:20}.slot:hover .lift{transform:translateY(calc(var(--cw)*-.2)) scale(1.07)}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .15s linear;animation:float 6s ease-in-out infinite;animation-delay:calc(var(--i)*-.8s)}
@keyframes float{50%{translate:0 -7px}}
.halo{position:absolute;inset:0;border-radius:5.6%;box-shadow:0 0 34px 6px rgba(201,162,74,.22),0 16px 34px rgba(0,0,0,.8);
  animation:pulse 4.5s ease-in-out infinite;animation-delay:calc(var(--i)*-.6s);transform:translateZ(-1px)}
@keyframes pulse{50%{box-shadow:0 0 52px 12px rgba(230,200,110,.42),0 16px 34px rgba(0,0,0,.8)}}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.inner{transform:rotateY(180deg)}
.faceup .inner{transform:rotateY(0)}
.slot.flipfront .inner{transform:rotateY(0)}.slot.flipback .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:5.6%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;isolation:isolate;background:#030303}
.face.back{transform:rotateY(180deg)}
.face img{width:100%;height:100%;display:block;user-drag:none;-webkit-user-drag:none}
.shine{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.55;
  background:linear-gradient(112deg,transparent 42%,rgba(255,224,150,.95) 50%,transparent 58%);background-size:300% 100%;background-position:150% 0;
  animation:sweep 5.5s ease-in-out infinite;animation-delay:calc(var(--i)*-.7s)}
.noshine .shine{display:none}
@keyframes sweep{0%{background-position:150% 0}55%,100%{background-position:-60% 0}}
.glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:0;transition:opacity .25s;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,236,170,.7),transparent 46%)}
.slot:hover .glare{opacity:.7}
.controls{position:relative;z-index:3;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:0 16px 26px}
button{font:inherit;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#1a1204;cursor:pointer;
  padding:11px 20px;border:1px solid #f0d98d;border-radius:999px;
  background:linear-gradient(180deg,#f0d98d,#c49a3a 55%,#8f6a1e);box-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.5)}
button:hover{filter:brightness(1.1)}button[aria-pressed="false"]{background:transparent;color:var(--ink);box-shadow:none}
@media (prefers-reduced-motion:reduce){.tilt,.halo,.shine,h1{animation:none}.slot{transition-duration:.01s;transition-delay:0s}canvas#dust{display:none}}
</style></head>

</div></div>
<div class="controls">
  <button id="deal">Deal again</button>
  <button id="flip">Flip all</button>
  <button id="shine" aria-pressed="true">Gold shimmer</button>
</div>
<script>
(function(){
  var stage=document.getElementById('stage'),slots=[].slice.call(document.querySelectorAll('.slot'));
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function deal(){
    stage.classList.remove('dealt');slots.forEach(function(s){s.classList.remove('flipfront','flipback')});
    document.body.classList.remove('faceup');
    void stage.offsetWidth;
    requestAnimationFrame(function(){stage.classList.add('dealt');
      setTimeout(function(){slots.forEach(function(s,i){setTimeout(function(){s.classList.remove('flipback');s.classList.add('flipfront')},i*140)})},reduce?0:1500)});
  }
  document.getElementById('deal').onclick=deal;
  var allUp=true;
  document.getElementById('flip').onclick=function(){
    slots.forEach(function(s,i){setTimeout(function(){
      var up=s.classList.contains('flipfront');
      s.classList.toggle('flipfront',!up);s.classList.toggle('flipback',up);},i*90)});
  };
  var sb=document.getElementById('shine');
  sb.onclick=function(){var on=sb.getAttribute('aria-pressed')==='true';sb.setAttribute('aria-pressed',String(!on));document.body.classList.toggle('noshine',on)};
  slots.forEach(function(s){
    var tilt=s.querySelector('.tilt'),glare=s.querySelector('.glare');
    s.addEventListener('pointermove',function(e){
      var r=s.querySelector('.lift').getBoundingClientRect();
      var x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      tilt.style.setProperty('--ry',((x-.5)*26).toFixed(1)+'deg');
      tilt.style.setProperty('--rx',((.5-y)*22).toFixed(1)+'deg');
      glare.style.setProperty('--mx',(x*100).toFixed(0)+'%');glare.style.setProperty('--my',(y*100).toFixed(0)+'%');
    });
    s.addEventListener('pointerleave',function(){tilt.style.setProperty('--rx','0deg');tilt.style.setProperty('--ry','0deg')});
    s.addEventListener('click',function(){
      var up=s.classList.contains('flipfront');
      s.classList.toggle('flipfront',!up);s.classList.toggle('flipback',up);
    });
  });
  // gold dust
  var cv=document.getElementById('dust'),cx=cv.getContext('2d'),P=[],w,h;
  function size(){w=cv.width=innerWidth;h=cv.height=innerHeight}
  size();addEventListener('resize',size);
  for(var i=0;i<70;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.4,v:Math.random()*.00018+.00005,a:Math.random()*6.28,s:Math.random()*.02+.005});
  function tick(){
    cx.clearRect(0,0,w,h);
    P.forEach(function(p){p.y-=p.v*16;p.a+=p.s;if(p.y<-.02){p.y=1.02;p.x=Math.random()}
      var o=(.25+.5*Math.abs(Math.sin(p.a)))*.7;
      cx.beginPath();cx.fillStyle='rgba(240,210,120,'+o+')';cx.arc(p.x*w+Math.sin(p.a)*8,p.y*h,p.r,0,6.28);cx.fill()});
    if(!reduce)requestAnimationFrame(tick);
  }
  if(!reduce)tick();
  deal();
})();
</script>
